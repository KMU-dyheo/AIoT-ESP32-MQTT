[platformio]
default_envs = esp32usb

[env:default]
platform = espressif32 @ 6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200

; Arduino ESP32 Core 2.0.17 (교육용 고정 버전)
; 공통 라이브러리는 이후 단계에서 여기에 추가
; lib_deps =

[env:esp32usb]
extends = env:default
upload_protocol = esptool

; OTA는 Step 08 이후 Wi-Fi 및 ArduinoOTA 구현 후 사용
[env:esp32ota]
extends = env:default
upload_protocol = espota
upload_port = 192.168.0.100
; wifi_config.h의 OTA_PASSWORD와 동일하게 변경 (실제 암호는 커밋하지 않기)
upload_flags = --auth=CHANGE_ME
