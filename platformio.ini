[platformio]
default_envs = esp32usb

[env]
platform = espressif32 @ 6.12.0
board = esp32doit-devkit-v1
board_build.mcu = esp32
board_build.f_cpu = 240000000L
framework = arduino
; ESP32 Arduino framework에 WiFi.h 라이브러리가 기본 포함됩니다.
; 별도 lib_deps 없이 #include <WiFi.h>를 사용할 수 있습니다.
monitor_speed = 115200

[env:esp32usb]
upload_protocol = esptool

[env:esp32ota]
upload_protocol = espota
upload_port = 192.168.0.100
; Step 08 이후 실제 OTA_PASSWORD와 일치하게 로컬에서 변경
; upload_flags = --auth=CHANGE_ME
