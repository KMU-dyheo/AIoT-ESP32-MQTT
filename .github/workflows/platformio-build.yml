name: ESP32 Step Build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/platformio-build.yml'
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch:
          - step-01-01-serial
          - step-01-01-serial-done
          - step-01-02-led-output
          - step-01-02-led-output-done
          - step-01-03-led-blink
          - step-01-03-led-blink-done
          - step-02-01-led-blink
          - step-02-01-led-blink-done
          - step-02-02-five-blinks
          - step-02-02-five-blinks-done
          - step-03-01-pwm-fade
          - step-03-01-pwm-fade-done
          - step-03-02-fade-speed
          - step-03-02-fade-speed-done
          - step-03-03-fade-interval
          - step-03-03-fade-interval-done
          - step-03-04-microseconds
          - step-03-04-microseconds-done
          - step-04-01-loop-timing
          - step-04-01-loop-timing-done
          - step-04-02-micros-fade
          - step-04-02-micros-fade-done
          - step-04-03-brightness-function
          - step-04-03-brightness-function-done
          - step-05-01-button-raw
          - step-05-01-button-raw-done
          - step-05-02-button-interval
          - step-05-02-button-interval-done
          - step-05-03-button-change
          - step-05-03-button-change-done
          - step-06-01-debounce-30ms
          - step-06-01-debounce-30ms-done
          - step-07-01-fade-toggle
          - step-07-01-fade-toggle-done
          - step-07-02-external-pulldown
          - step-07-02-external-pulldown-done
          - step-07-03-internal-pulldown
          - step-07-03-internal-pulldown-done
          - step-07-04-internal-pullup
          - step-07-04-internal-pullup-done
          - step-07-05-button-function
          - step-07-05-button-function-done
          - step-08-01-wifi-library
          - step-08-01-wifi-library-done
          - step-08-02-application-split
          - step-08-02-application-split-done
          - step-08-03-wifi-structure
          - step-08-03-wifi-structure-done
          - step-08-04-wifi-connect
          - step-08-04-wifi-connect-done
          - step-08-05-ota
          - step-08-05-ota-done
          - step-01-onboard-led
          - step-01-onboard-led-done
          - step-02-external-led
          - step-02-external-led-done
          - step-03-led-pwm
          - step-03-led-pwm-done
          - step-04-led-nonblocking
          - step-04-led-nonblocking-done
          - step-05-button
          - step-05-button-done
          - step-06-button-nonblocking
          - step-06-button-nonblocking-done
          - step-07-button-led
          - step-07-button-led-done
          - step-08-wifi
          - step-08-wifi-done
          - step-09-mqtt-connect
          - step-09-mqtt-connect-done
          - step-10-mqtt-publish
          - step-10-mqtt-publish-done
          - step-10-01-button-event
          - step-10-01-button-event-done
          - step-10-02-led-state
          - step-10-02-led-state-done
          - step-11-mqtt-control
          - step-11-mqtt-control-done
          - step-12-aws-iot-connect
          - step-12-aws-iot-connect-done
          - step-13-aws-iot-control
          - step-13-aws-iot-control-done
    steps:
      - name: Check out lesson branch
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Prepare non-secret lab configuration for compilation
        shell: bash
        run: |
          if [ -f include/wifi_config.example.h ]; then cp include/wifi_config.example.h include/wifi_config.h; fi
          if [ -f include/mqtt_config.example.h ]; then cp include/mqtt_config.example.h include/mqtt_config.h; fi
          if [ -f include/aws_certificates.example.h ]; then cp include/aws_certificates.example.h include/aws_certificates.h; fi
      - name: Build USB firmware
        run: pio run
