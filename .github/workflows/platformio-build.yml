name: ESP32 Step Build and Curriculum Check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/platformio-build.yml'
      - 'tools/check_curriculum.py'
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch:
          - step-01-onboard-led
          - step-01-onboard-led-done
          - step-02-external-led
          - step-02-external-led-done
          - step-03-led-pwm
          - step-03-led-pwm-done
          - step-04-led-nonblocking
          - step-04-led-nonblocking-done
          - step-05-button
          - step-05-button-done
          - step-06-button-nonblocking
          - step-06-button-nonblocking-done
          - step-07-button-led
          - step-07-button-led-done
          - step-08-wifi
          - step-08-wifi-done
          - step-09-mqtt-connect
          - step-09-mqtt-connect-done
          - step-10-mqtt-publish
          - step-10-mqtt-publish-done
          - step-10-01-button-event
          - step-10-01-button-event-done
          - step-10-02-led-state
          - step-10-02-led-state-done
          - step-11-mqtt-control
          - step-11-mqtt-control-done
          - step-12-aws-iot-connect
          - step-12-aws-iot-connect-done
          - step-13-aws-iot-control
          - step-13-aws-iot-control-done
    steps:
      - name: Check out lesson branch
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
      - name: Check out validator from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: .course-validation
      - name: Check step progression against existing lecture
        run: python .course-validation/tools/check_curriculum.py --branch ${{ matrix.branch }} --root .
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Prepare non-secret lab configuration for compilation
        shell: bash
        run: |
          if [ -f include/wifi_config.example.h ]; then cp include/wifi_config.example.h include/wifi_config.h; fi
          if [ -f include/mqtt_config.example.h ]; then cp include/mqtt_config.example.h include/mqtt_config.h; fi
          if [ -f include/aws_certificates.example.h ]; then cp include/aws_certificates.example.h include/aws_certificates.h; fi
      - name: Build USB firmware
        run: pio run -e esp32usb
